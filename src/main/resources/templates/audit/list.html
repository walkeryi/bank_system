<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments :: head('审计日志')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{fragments :: sidebar('/audit/list')}"></aside>
  <div class="main-col">
    <header th:replace="~{fragments :: topbar}"></header>
    <main class="content" id="app">
      <data-table ref="tbl" url="/api/audit/list" :columns="cols" pk="id" :params="q" :page-size="5">
        <template #title>审计日志</template>
        <template #search>
          <div class="d-flex flex-wrap align-items-center gap-2 p-3 border-bottom bg-light">
            <input class="form-control form-control-sm" style="max-width:140px" v-model.trim="q.operatorUserName" @keyup.enter="reload()" placeholder="操作人"/>
            <button class="btn btn-sm btn-primary" @click="reload()">搜索</button>
            <button class="btn btn-sm btn-outline-secondary" @click="reset()">重置</button>
          </div>
        </template>
      </data-table>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script>
Bank.mount({
  data(){ return {
    cols: [{"f": "logId", "label": "ID"}, {"f": "operatorUserName", "label": "操作人"}, {"f": "operateModule", "label": "模块"}, {"f": "operateType", "label": "动作"}, {"f": "businessKey", "label": "业务标识"}, {"f": "operateContent", "label": "操作详情"}, {"f": "operateTime", "label": "时间"}],
    q: { operatorUserName:'', operateModule:'', operateType:'' }
  }; },
  methods: {
    reload(){ this.$refs.tbl.reload(); },
    reset(){ this.q.operatorUserName=''; this.q.operateModule=''; this.q.operateType=''; this.reload(); }
  }
});
</script>
</body>
</html>
