<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments :: head('注册')}"></head>
<body>
<div class="login-wrap">
    <div class="card login-card">
        <div class="card-body p-4">
            <h4 class="text-center mb-1">银行网点管理系统</h4>
            <p class="text-center text-muted mb-4">Bank Branch Management - 用户注册</p>
            <div id="app">
                <div class="alert alert-danger py-2" v-if="error">{{ error }}</div>
                <div class="alert alert-success py-2" v-if="success">{{ success }}</div>
                <form @submit.prevent="register">
                    <div class="mb-1">
                        <label class="form-label">账号</label>
                        <input class="form-control" v-model="userNo" placeholder="请输入账号" required/>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">用户名</label>
                        <input class="form-control" v-model="userName" placeholder="输入真实姓名" required/>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">身份证号</label>
                        <input class="form-control" v-model="idCard" placeholder="请输入身份证号" required/>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">手机号</label>
                        <input class="form-control" v-model="phone" placeholder="请输入手机号码" required/>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">角色类型</label>
                        <select class="form-select" v-model="roleId" required>
                            <option value="">请选择角色</option>
                            <option value="TELLER">柜员(T)</option>
                            <option value="LOAN">信贷员(C)</option>
                            <option value="MANAGER">分行经理(M)</option>
                            <option value="RISK">风控审计(X)</option>
                            <option value="CUSTOMER">客户(S)</option>
                        </select>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" v-model="password" placeholder="至少6位字符" required/>
                    </div>
                    <div class="mb-1">
                        <label class="form-label">确认密码</label>
                        <input type="password" class="form-control" v-model="confirmPwd" placeholder="再次输入密码" required/>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">注 册</button>
                </form>
                <p class="text-muted small mt-3 mb-0 text-center">
                    已有账号？<a th:href="@{/login}">前往登录</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
<script th:src="@{/static/js/common.js}"></script>
<script>
    Vue.createApp({
        data(){
            return {
                userNo:'',
                userName:'',
                idCard:'',
                phone:'',
                roleId:'',
                password:'',
                confirmPwd:'',
                error:'',
                success:''
            };
        },
        methods:{
            register(){
                this.error='';
                this.success='';
                // 前端校验两次密码
                if(this.password !== this.confirmPwd){
                    this.error = '两次输入密码不一致';
                    return;
                }
                if(this.phone.length !=11){
                    this.error = '手机号长度要11为位';
                    return;
                }
                if(this.idCard.length !=18){
                    this.error = '身份证号长度要18为位';
                    return;
                }
                if(this.password.length <6){
                    this.error = '密码长度不能少于6位';
                    return;
                }
                axios.post('/api/register',{
                    userNo: this.userNo,
                    userName: this.userName,
                    idCard: this.idCard,
                    phone:this.phone,
                    roleId: this.roleId,
                    password: this.password
                })
                    .then(r=>{
                        if(r.data.code===200){
                            this.success = '注册成功，即将跳转到登录页';
                            // 2秒后跳转登录
                            setTimeout(()=>{
                                location.href='/login';
                            },2000);
                        }else{
                            this.error = r.data.msg;
                        }
                    })
                    .catch(e=>{
                        this.error='注册请求失败，请检查服务';
                    });
            }
        }
    }).mount('#app');
</script>
</body>
</html>
