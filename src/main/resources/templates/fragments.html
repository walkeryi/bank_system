<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">银行网点管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/static/css/app.css}"/>
</head>
<body>

<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">银行网点管理系统</div>
    <nav class="nav flex-column py-2">
        <a th:each="m : ${session.menuList}" class="nav-link"
           th:classappend="${m.menuUrl == active} ? 'active' : ''"
           th:href="${m.menuUrl}" th:text="${m.menuName}">菜单</a>
    </nav>
</aside>

<header th:fragment="topbar" class="topbar">
    <div class="sys">银行网点业务处理平台</div>
    <div class="d-flex align-items-center">
        <span class="me-3 text-muted">
            欢迎，<b th:text="${session.loginUser?.userName}">用户</b>
            （<span th:text="${session.loginUser?.userNo}">工号</span>）
        </span>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/user/toPassword}">修改密码</a>
        <a class="btn btn-sm btn-outline-danger ms-2" th:href="@{/logout}">退出登录</a>
    </div>
</header>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script th:src="@{/static/js/dict.js}"></script>
    <script th:src="@{/static/js/common.js}"></script>
</th:block>

</body>
</html>
