<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments :: head('角色管理')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{fragments :: sidebar('/role/list')}"></aside>
  <div class="main-col">
    <header th:replace="~{fragments :: topbar}"></header>
    <main class="content" id="app">
      <data-table ref="tbl" url="/api/role/list" :columns="cols" pk="roleId" :params="q" :page-size="5">
        <template #title>角色管理</template>
        <template #search>
          <div class="d-flex flex-wrap align-items-center gap-2 p-3 border-bottom bg-light">
            <input class="form-control form-control-sm" style="max-width:180px" v-model.trim="q.roleName" @keyup.enter="reload()" placeholder="角色名称"/>
            <button class="btn btn-sm btn-primary" @click="reload()">搜索</button>
            <button class="btn btn-sm btn-outline-secondary" @click="reset()">重置</button>
          </div>
        </template>
      </data-table>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script>
Bank.mount({
  data(){ return {
    cols: [{"f": "roleId", "label": "ID"}, {"f": "roleName", "label": "角色名称"}, {"f": "roleDesc", "label": "角色描述"}, {"f": "createTime", "label": "创建时间"}],
    q: { roleName:'' }
  }; },
  methods: {
    reload(){ this.$refs.tbl.reload(); },
    reset(){ this.q.roleName=''; this.reload(); }
  }
});
</script>
</body>
</html>
