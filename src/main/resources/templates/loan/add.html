<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments :: head('贷款申请')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{fragments :: sidebar('/loan/toAdd')}"></aside>
  <div class="main-col">
    <header th:replace="~{fragments :: topbar}"></header>
    <main class="content" id="app">
      <div class="card" style="max-width:720px"><div class="card-header">贷款申请</div>
      <div class="card-body"><form @submit.prevent="submit" class="row g-3">
        <div class="col-md-6"><label class="form-label">借款客户ID *</label><input type="number" class="form-control" v-model.number="f.userId" required/></div>
        <div class="col-md-6"><label class="form-label">贷款金额 *</label><input type="number" step="any" class="form-control" v-model.number="f.loanAmount" required/></div>
        <div class="col-md-6"><label class="form-label">期限(月) *</label><input type="number" class="form-control" v-model.number="f.loanTerm" required/></div>
        <div class="col-md-6"><label class="form-label">年利率 *</label><input type="number" step="any" class="form-control" placeholder="如 0.042" v-model.number="f.rate" required/></div>
        <div class="col-md-6"><label class="form-label">贷款用途</label><input class="form-control" v-model="f.loanPurpose"/></div>
        <div class="col-md-6"><label class="form-label">备注</label><input class="form-control" v-model="f.remark"/></div>
        <div class="col-12"><button class="btn btn-primary">提交</button> <a class="btn btn-outline-secondary" href="/loan/list">返回列表</a></div>
      </form></div></div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script>
Bank.mount({
  data(){ return { f:{ userId:null,loanAmount:null,loanTerm:null,rate:null,loanPurpose:'',remark:'' } }; },
  methods:{
    submit(){ Bank.http.post('/api/loan/add',this.f).then(r=>{ if(r.data.code===200){alert('申请已提交');location.href='/loan/list';}else alert(r.data.msg); }); }
  }
});
</script>
</body>
</html>
