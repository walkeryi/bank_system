<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments :: head('修改密码')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{fragments :: sidebar('/user/toPassword')}"></aside>
    <div class="main-col">
        <header th:replace="~{fragments :: topbar}"></header>
        <main class="content" id="app">
            <div class="page-head"><h1 class="page-title">修改密码</h1></div>
            <div class="card" style="max-width:520px">
                <div class="card-body" style="padding:26px 28px">
                    <div class="alert alert-danger py-2" v-if="error">{{error}}</div>
                    <form @submit.prevent="submit" class="row g-3">
                        <div class="col-12"><label class="form-label">原密码</label>
                            <input type="password" class="form-control" v-model="oldPwd" required/></div>
                        <div class="col-12"><label class="form-label">新密码</label>
                            <input type="password" class="form-control" v-model="newPwd" required/></div>
                        <div class="col-12"><label class="form-label">确认新密码</label>
                            <input type="password" class="form-control" v-model="confirmPwd" required/></div>
                        <div class="col-12">
                            <button class="btn btn-primary me-2" type="submit" :disabled="busy">{{ busy ? '提交中…' : '确认修改' }}</button>
                            <a class="btn btn-outline-secondary" th:href="@{/index}">返回</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script>
Bank.mount({
  data(){ return { oldPwd:'', newPwd:'', confirmPwd:'', error:'', busy:false }; },
  methods:{ submit(){
      if(this.busy) return;
      this.error='';
      if(this.newPwd!==this.confirmPwd){ this.error='两次输入的新密码不一致'; return; }
      this.busy = true;
      Bank.http.post('/api/user/password',{ oldPwd:this.oldPwd, newPwd:this.newPwd }).then(r=>{
          if(r.data.code===200){ alert('密码已修改，请重新登录'); location.href='/logout'; }
          else { this.busy = false; this.error=r.data.msg; }
      }).catch(()=>{ this.busy = false; });
  }}
});
</script>
</body>
</html>
