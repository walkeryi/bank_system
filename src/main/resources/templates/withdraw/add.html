<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head th:replace="~{fragments :: head('发起大额取款申请')}"></head>
<body>
<div class="layout">
  <aside th:replace="~{fragments :: sidebar('/withdraw/toAdd')}"></aside>
  <div class="main-col">
    <header th:replace="~{fragments :: topbar}"></header>
    <main class="content" id="app">
      <div class="card" style="max-width:720px"><div class="card-header">发起大额取款申请</div>
      <div class="card-body"><form @submit.prevent="submit" class="row g-3">
        <div class="col-md-6"><label class="form-label">取款账户ID *</label><input type="number" class="form-control" v-model.number="f.accountId" required/></div>
        <div class="col-md-6"><label class="form-label">取款金额 *</label><input type="number" step="any" class="form-control" v-model.number="f.withdrawAmount" required/></div>
        <div class="col-12"><button class="btn btn-primary">提交</button> <a class="btn btn-outline-secondary" href="/withdraw/list">返回列表</a></div>
      </form></div></div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script>
Bank.mount({
  data(){ return { f:{ accountId:null, withdrawAmount:null } }; },
  methods:{
    submit(){ Bank.http.post('/api/withdraw/add',this.f).then(r=>{ if(r.data.code===200){alert('申请已提交，等待分行经理授权');location.href='/withdraw/list';}else alert(r.data.msg); }); }
  }
});
</script>
</body>
</html>
